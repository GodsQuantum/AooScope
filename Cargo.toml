[workspace]
members = [
  "crates/aooscope-types",
  "crates/aooscope-config",
  "crates/aooscope-server",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8.9", features = ["json", "multipart"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id", "limit"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2.0.20"
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
