name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-svelte-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust and Svelte checks in pinned toolchains
        run: docker build --target rust-check -t aooscope:rust-check .
      - name: Build foundation image
        run: docker build -t aooscope:rust-foundation .
      - name: OCI smoke and runtime scan
        run: |
          bash tests/test_oci_smoke.sh aooscope:rust-foundation
          bash tests/test_runtime_executables.sh aooscope:rust-foundation
      - name: Deployment and repository gates
        run: |
          bash tests/test_deployment.sh
          bash tests/test_repo_hygiene.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit advisories
        run: cargo audit
      - name: Validate licenses, sources, and bans
        run: cargo deny check
