name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reference system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check flask pillow waitress
      - name: Reference tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Deployment contract
        run: bash tests/test_deployment.sh

  rust-svelte-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust and Svelte checks in pinned toolchains
        run: docker build --target rust-check -t aooscope:rust-check .
      - name: Build foundation image
        run: docker build -t aooscope:rust-foundation .

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit advisories
        run: cargo audit
      - name: Validate licenses, sources, and bans
        run: cargo deny check
