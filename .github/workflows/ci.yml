name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check flask pillow waitress
      - name: Compile Python
        run: python -m compileall -q aooscope webui.py
      - name: Validate Admin JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from webui import ADMIN_HTML
          script = ADMIN_HTML.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/aooscope-admin.js').write_text(script)
          PY
          node --check /tmp/aooscope-admin.js
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Deployment contract
        run: bash tests/test_deployment.sh
