[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # Transitive from asterctl-lcd -> image(default features). Upstream HEAD is pinned
  # and still carries `TODO make image an optional feature`; no safe upgrade exists.
  "RUSTSEC-2024-0436",
  # fontdue 0.9.4 depends on ttf-parser 0.25.1. This advisory is maintenance
  # status only (not a vulnerability) and explicitly has no safe upgrade;
  # keep the exception narrow until typography migrates to an active parser.
  "RUSTSEC-2026-0192",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "ISC",
  "NCSA",
  "OFL-1.1",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/zehnm/aoostar-rs",
]
