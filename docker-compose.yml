name: aooscope
services:
  aooscope:
    build:
      context: .
    image: ${AOOSCOPE_IMAGE:-aooscope:local}
    container_name: ${AOOSCOPE_CONTAINER_NAME:-aooscope}
    restart: unless-stopped
    ports:
      - "${AOOSCOPE_BIND_ADDRESS:-127.0.0.1}:${AOOSCOPE_WEB_PORT:-8765}:8765"
    devices:
      - "${AOOSCOPE_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    volumes:
      - "${AOOSCOPE_CONFIG_DIR:-./data/cfg}:/app/cfg"
      - "${AOOSCOPE_SECRETS_DIR:-./data/secrets}:/run/aooscope-secrets:ro"
    environment:
      AOOSCOPE_DEVICE: /dev/ttyACM0
      AOOSCOPE_REFRESH_SECONDS: ${AOOSCOPE_REFRESH_SECONDS:-5}
      AOOSCOPE_SYSINFO_SECONDS: ${AOOSCOPE_SYSINFO_SECONDS:-5}
      PVE_API_URL: ${PVE_API_URL:-}
      PVE_NODE: ${PVE_NODE:-pve}
      PVE_TOKEN_FILE: ${PVE_TOKEN_FILE:-}
      PVE_CA_FILE: ${PVE_CA_FILE:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY_FILE: ${JELLYFIN_API_KEY_FILE:-}
      SILO_URL: ${SILO_URL:-}
      SILO_API_KEY_FILE: ${SILO_API_KEY_FILE:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY_FILE: ${RADARR_API_KEY_FILE:-}
      QBIT_URL: ${QBIT_URL:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
