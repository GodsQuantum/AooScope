name: aooscope
services:
  aooscope:
    image: ghcr.io/godsquantum/aooscope:${AOOSCOPE_TAG:-latest}
    pull_policy: always
    container_name: ${AOOSCOPE_CONTAINER_NAME:-aooscope}
    restart: unless-stopped
    ports:
      - "${AOOSCOPE_BIND_ADDRESS:-127.0.0.1}:${AOOSCOPE_WEB_PORT:-8765}:8765"
    devices:
      - "${AOOSCOPE_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    volumes:
      - "${AOOSCOPE_CONFIG_DIR:-./data}:/app/cfg"
    environment:
      AOOSCOPE_DEVICE: /dev/ttyACM0
      AOOSCOPE_DISPLAY_MODE: real
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/aooscope
        - health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
