name: aooscope
services:
  aooscope:
    image: ghcr.io/godsquantum/aooscope:${AOOSCOPE_TAG:-latest}
    pull_policy: always
    container_name: ${AOOSCOPE_CONTAINER_NAME:-aooscope}
    restart: unless-stopped
    ports:
      - "${AOOSCOPE_BIND_ADDRESS:-127.0.0.1}:${AOOSCOPE_WEB_PORT:-8765}:8765"
    devices:
      - "${AOOSCOPE_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    volumes:
      - "${AOOSCOPE_CONFIG_DIR:-./data}:/app/cfg"
    environment:
      AOOSCOPE_DEVICE: /dev/ttyACM0
      AOOSCOPE_REFRESH_SECONDS: ${AOOSCOPE_REFRESH_SECONDS:-5}
      AOOSCOPE_SYSINFO_SECONDS: ${AOOSCOPE_SYSINFO_SECONDS:-5}
      AOOSCOPE_BRAND: ${AOOSCOPE_BRAND:-AOOSCOPE}
      AOOSCOPE_SPLASH_IMAGE: ${AOOSCOPE_SPLASH_IMAGE:-}
      AOOSCOPE_SWITCH_SECONDS: ${AOOSCOPE_SWITCH_SECONDS:-8}
      AOOSCOPE_BRIGHTNESS: ${AOOSCOPE_BRIGHTNESS:-100}
      PVE_TOKEN_FILE: ${PVE_TOKEN_FILE:-}
      PVE_CA_FILE: ${PVE_CA_FILE:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/',timeout=3).read(1)"
          && pgrep -f 'python3 -m aooscope.telemetry' >/dev/null
          && pgrep -f 'python3 -m aooscope.supervisor' >/dev/null
          && pgrep -x asterctl >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
